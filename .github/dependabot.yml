version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the test and benchmark tooling rather than five. These move
      # together and none of them ships to consumers.
      test-and-benchmark:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
          - "Moq"
          - "BenchmarkDotNet*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
