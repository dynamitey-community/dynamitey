blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/dynamitey-community/dynamitey/security/advisories/new
    about: Do not open a public issue for a security problem. Use private reporting.

  - name: Question about using the library
    url: https://github.com/dynamitey-community/dynamitey/discussions
    about: Usage questions are better as a discussion than an issue. If discussions are not enabled yet, a blank issue is fine.

  - name: Upstream project
    url: https://github.com/ekonbenefits/dynamitey
    about: The original project, and the source of the Dynamitey package on nuget.org. Problems with that published package belong there.
