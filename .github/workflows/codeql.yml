name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a commit.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Manual build mode rather than autobuild: this solution multi-targets, and
      # autobuild picks one leg without saying which.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Only the shipped library is built, and therefore only the shipped library
      # is extracted and analysed. paths-ignore in the config file cannot do this
      # on its own: for compiled languages CodeQL analyses whatever the build
      # produces, so excluding a project means not building it. See the config
      # file for why Tests/ and Benchmarks/ are out of scope.
      - name: Build
        run: dotnet build Dynamitey/Dynamitey.csproj --configuration Release

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
