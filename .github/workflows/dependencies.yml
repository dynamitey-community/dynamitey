name: Dependencies

on:
  pull_request:
  schedule:
    # Weekly. A dependency does not have to change to become vulnerable —
    # an advisory published today applies to the versions pinned last year.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Blocks a PR that introduces a dependency with a known advisory, before
      # it is merged rather than after.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  audit:
    name: NuGet audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # `dotnet list package --vulnerable` exits 0 whether or not it finds
      # anything, so the exit code cannot be trusted. Grep the output instead.
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found. See the output above."
            exit 1
          fi
          echo "No vulnerable packages."

      # Deprecated and outdated are reported, not enforced. A deprecated package
      # needs a human decision about what replaces it, and failing the build on
      # "outdated" would mean every upstream release breaks this repository.
      - name: Deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated

      - name: Outdated packages
        continue-on-error: true
        run: dotnet list package --outdated

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: vulnerable.txt
          retention-days: 30

  owasp:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    # This is deliberately not redundant with the NuGet audit above. That audit
    # queries the GitHub Advisory Database; OWASP Dependency-Check matches
    # against the NVD by CPE. The two datasets genuinely diverge - an advisory
    # can exist in one before, or without, the other - so running both widens
    # coverage rather than repeating it.
    #
    # The tradeoff is that CPE matching is name-based and produces false
    # positives, which is what the suppression file is for. A suppression there
    # needs a written reason, the same standard as a dismissed CodeQL alert.
    env:
      DC_VERSION: '13.0.0'
      # Pinned by content, not just by URL. The project publishes a GPG
      # signature but no checksum file, so this hash was computed from the
      # v13.0.0 release asset and committed. If the download ever stops matching,
      # the step fails rather than running an unverified binary.
      DC_SHA256: '44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed'
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restore first so obj/project.assets.json exists. That file is what
      # Dependency-Check's MSBuild analyzer reads to learn the real resolved
      # dependency graph, transitive packages included - scanning the csproj
      # alone would only see direct references.
      - name: Restore
        run: dotnet restore

      # The NVD database is large and slow to build from scratch. Keyed by week
      # so it refreshes regularly without re-downloading on every run.
      - name: Compute Dependency-Check cache key (year-week)
        shell: bash
        run: echo "DC_CACHE_KEY=$(date -u +'%G-%V')" >> "$GITHUB_ENV"

      - name: Cache the NVD data
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-${{ env.DC_VERSION }}-${{ env.DC_CACHE_KEY }}
          restore-keys: |
            dependency-check-${{ env.DC_VERSION }}-
      - name: Download and verify Dependency-Check
        shell: bash
        run: |
          curl -sSL -o dc.zip \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"

          echo "${DC_SHA256}  dc.zip" | sha256sum --check --status || {
            echo "::error::Dependency-Check download did not match the pinned SHA-256. Refusing to run it."
            echo "Expected: ${DC_SHA256}"
            echo "Actual:   $(sha256sum dc.zip | cut -d' ' -f1)"
            exit 1
          }

          unzip -q dc.zip
          echo "Verified dependency-check ${DC_VERSION}."

      - name: Run Dependency-Check
        shell: bash
        env:
          # Optional. Without it the NVD API throttles hard and the first run of
          # the week takes far longer; findings are the same either way. Add a
          # repository secret named NVD_API_KEY to speed it up - a key is free
          # from https://nvd.nist.gov/developers/request-an-api-key
          DC_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          tKeyArg=()
          if [ -z "${DC_NVD_API_KEY}" ]; then
            echo "::notice::No NVD_API_KEY secret is set. The scan will still run, but the NVD update is rate-limited and slower."
          else
            tKeyArg=(--nvdApiKey "${DC_NVD_API_KEY}")
          fi

          # Dependency-Check validates --out before it runs and refuses a path
          # that does not exist yet, rather than creating it.
          mkdir -p reports

          # --enableExperimental turns on the MSBuild project assets analyzer,
          # which is the one that understands PackageReference. Without it a
          # modern .NET project reports almost nothing.
          #
          # --failOnCVSS 7 fails the job on High and Critical only. Everything
          # found is still written to the report regardless of score.
          set +e
          ./dependency-check/bin/dependency-check.sh \
            --project "Dynamitey" \
            --scan "." \
            --exclude "**/dependency-check/**" \
            --enableExperimental \
            --failOnCVSS 7 \
            --suppression .github/owasp-suppressions.xml \
            --format HTML --format JSON --format SARIF \
            --out reports \
            "${tKeyArg[@]}"
          tExit=$?
          set -e

          echo "DC_EXIT=${tExit}" >> "$GITHUB_ENV"
          exit 0

      - name: Summarise findings
        if: always()
        shell: bash
        run: |
          if [ ! -f reports/dependency-check-report.json ]; then
            echo "::error::Dependency-Check produced no report. The scan did not complete."
            exit 1
          fi

          # Count dependencies carrying at least one vulnerability. jq is
          # preinstalled on the GitHub runners.
          tVulnerable=$(jq '[.dependencies[]? | select(.vulnerabilities != null)] | length' reports/dependency-check-report.json)
          tFindings=$(jq '[.dependencies[]?.vulnerabilities // [] | .[]] | length' reports/dependency-check-report.json)

          {
            echo "### OWASP Dependency-Check"
            echo
            echo "Scanned against the NVD, which is a different dataset from the GitHub Advisory Database used by the NuGet audit."
            echo
            echo "| Dependencies with findings | Total findings |"
            echo "| ---: | ---: |"
            echo "| $tVulnerable | $tFindings |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$tFindings" -eq 0 ]; then
            echo "No vulnerabilities reported." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "| Dependency | CVE | Severity | CVSS |"
              echo "| --- | --- | --- | ---: |"
              jq -r '.dependencies[]? | select(.vulnerabilities != null) | .fileName as $f | .vulnerabilities[] | "| \($f) | \(.name) | \(.severity // "unknown") | \(.cvssv3.baseScore // .cvssv2.score // "n/a") |"' \
                reports/dependency-check-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The scan step deliberately swallowed its own exit code so this
          # summary always gets written. Re-apply it here: a non-zero exit from
          # Dependency-Check means it found something at or above CVSS 7.
          if [ "${DC_EXIT}" -ne 0 ]; then
            echo "::error::Dependency-Check failed the CVSS 7 threshold. See the report artifact and the table above."
            exit 1
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: reports
          retention-days: 30
