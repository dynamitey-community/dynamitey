name: CI

# Pushes only run CI on main. Everything else is covered by the pull_request
# trigger, which stops every branch push producing a duplicate run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run still in flight for the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # -warnaserror is the gate. The tree builds clean with .NET analyzers at
      # AnalysisLevel=latest, so any new warning is a regression, not a backlog
      # item. Kept out of the project files so a local build stays workable.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The full suite. There is no category filter: the wall-clock benchmarks
      # that used to require one now live in Benchmarks/ and assert nothing.
      # shell: bash, and an explicit pipefail, because the pipeline's exit status
      # would otherwise be tee's - always 0 - and a failing suite would sail past
      # this step. GitHub's bash shell already runs with -eo pipefail, so the
      # `set` line is belt and braces: it keeps the guarantee local to the script
      # rather than resting on a runner default that is not visible here.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=tests-${{ matrix.os }}.trx" \
            --results-directory TestResults \
            | tee test-output.txt

      # Puts the executed count on the job summary page rather than leaving it
      # buried in the log. The count is deliberately not pinned to a number
      # anywhere: the bar is 0 failed and 0 skipped, which survives new tests.
      - name: Report test counts
        if: always()
        shell: bash
        run: |
          tLine=$(grep -oE 'Failed: +[0-9]+, Passed: +[0-9]+, Skipped: +[0-9]+, Total: +[0-9]+' test-output.txt | tail -1)
          if [ -z "$tLine" ]; then
            echo "::error::Could not find a test summary line in the test output."
            exit 1
          fi

          tFailed=$(echo "$tLine"  | sed -E 's/.*Failed: +([0-9]+).*/\1/')
          tPassed=$(echo "$tLine"  | sed -E 's/.*Passed: +([0-9]+).*/\1/')
          tSkipped=$(echo "$tLine" | sed -E 's/.*Skipped: +([0-9]+).*/\1/')
          tTotal=$(echo "$tLine"   | sed -E 's/.*Total: +([0-9]+).*/\1/')

          {
            echo "### Tests (${{ matrix.os }})"
            echo
            echo "| Total | Passed | Failed | Skipped |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| $tTotal | $tPassed | $tFailed | $tSkipped |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A skipped test is a test that is not telling you anything. The suite
          # runs with no category filter precisely so this stays at zero; a
          # filter creeping back into the test command is the thing worth
          # catching, and it shows up here as a changed total.
          if [ "$tSkipped" -ne 0 ]; then
            echo "::error::$tSkipped test(s) skipped. The bar is 0 failed and 0 skipped, with no category filter."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 14

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    # tests / line / branch feed the main-only publish-badges job. Empty when
    # this job fails, and that job is skipped — last successful SVGs stay.
    outputs:
      tests: ${{ steps.badges.outputs.tests }}
      line: ${{ steps.floors.outputs.line }}
      branch: ${{ steps.floors.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # coverlet.runsettings restricts the report to the Dynamitey assembly.
      # Without it the figure also covers SupportLibrary, a fixture that exists
      # only to be called from tests, so the number would describe the fixtures
      # rather than the library being shipped.
      # tee is so the badge job can read Total: from the same run that produced
      # the cobertura file. pipefail because otherwise tee's 0 would hide a
      # failed suite — same belt-and-braces as the build-test job.
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Tests.csproj \
            --configuration Release \
            --no-build \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            | tee test-output.txt

      # ReportGenerator as a local tool rather than a third-party action: one
      # fewer external action in the supply chain. The explicit --version is the
      # point of doing it this way - without it `dotnet tool install` takes
      # whatever is newest at the moment the job runs, which is neither
      # reproducible nor reviewable.
      - name: Install ReportGenerator
        run: dotnet tool install --tool-path ./tools --version 5.5.11 dotnet-reportgenerator-globaltool

      - name: Generate report
        run: >
          ./tools/reportgenerator
          -reports:TestResults/**/coverage.cobertura.xml
          -targetdir:CoverageReport
          -reporttypes:"MarkdownSummaryGithub;HtmlInline;Cobertura"

      - name: Publish coverage to the job summary
        shell: bash
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # A floor, not a target. Set just under the figures at the time it was
      # introduced so it ratchets rather than trapping: a change that lowers
      # coverage fails, while the day-to-day noise of a few lines moving does
      # not. Raise the floor when the real number moves up and stays there.
      #
      # Both numbers are checked because they answer different questions. Line
      # coverage says which code ran; branch coverage says whether both sides of
      # a decision ran. For this library the gap between them is the point -
      # dispatch code is mostly branches, so a high line figure can hide a lot
      # of untested decisions.
      - name: Enforce coverage floors
        id: floors
        shell: bash
        env:
          MIN_LINE: '95'
          MIN_BRANCH: '84'
        run: |
          tReport=$(find TestResults -name coverage.cobertura.xml | head -1)
          if [ -z "$tReport" ]; then
            echo "::error::No cobertura report was produced."
            exit 1
          fi

          tHeader=$(grep -oE '^<coverage[^>]*' "$tReport")
          tLineRate=$(echo "$tHeader"   | grep -oE 'line-rate="[0-9.]+"'   | grep -oE '[0-9.]+')
          tBranchRate=$(echo "$tHeader" | grep -oE 'branch-rate="[0-9.]+"' | grep -oE '[0-9.]+')

          tLinePct=$(awk -v r="$tLineRate"   'BEGIN { printf "%.1f", r * 100 }')
          tBranchPct=$(awk -v r="$tBranchRate" 'BEGIN { printf "%.1f", r * 100 }')

          tLinesCovered=$(echo "$tHeader"    | grep -oE 'lines-covered="[0-9]+"'    | grep -oE '[0-9]+')
          tLinesValid=$(echo "$tHeader"      | grep -oE 'lines-valid="[0-9]+"'      | grep -oE '[0-9]+')
          tBranchesCovered=$(echo "$tHeader" | grep -oE 'branches-covered="[0-9]+"' | grep -oE '[0-9]+')
          tBranchesValid=$(echo "$tHeader"   | grep -oE 'branches-valid="[0-9]+"'   | grep -oE '[0-9]+')

          {
            echo "### Coverage floors"
            echo
            echo "| Metric | Covered | Total | Percent | Floor |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            echo "| Lines | $tLinesCovered | $tLinesValid | ${tLinePct}% | ${MIN_LINE}% |"
            echo "| Branches | $tBranchesCovered | $tBranchesValid | ${tBranchPct}% | ${MIN_BRANCH}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          tFailed=0
          if awk -v p="$tLinePct" -v m="$MIN_LINE" 'BEGIN { exit !(p < m) }'; then
            echo "::error::Line coverage ${tLinePct}% is below the ${MIN_LINE}% floor."
            tFailed=1
          fi
          if awk -v p="$tBranchPct" -v m="$MIN_BRANCH" 'BEGIN { exit !(p < m) }'; then
            echo "::error::Branch coverage ${tBranchPct}% is below the ${MIN_BRANCH}% floor."
            tFailed=1
          fi

          echo "line=${tLinePct}" >> "$GITHUB_OUTPUT"
          echo "branch=${tBranchPct}" >> "$GITHUB_OUTPUT"
          exit $tFailed

      # Executed total, not a hand count of [Test] attributes. NUnit expands
      # [TestCase] / [TestCaseSource], so those two figures do not match.
      # Same 0-skipped bar as build-test: dotnet test exits 0 with skips, so
      # without this a skip would still publish a new tests badge.
      - name: Record test total for badges
        id: badges
        shell: bash
        run: |
          tLine=$(grep -oE 'Failed: +[0-9]+, Passed: +[0-9]+, Skipped: +[0-9]+, Total: +[0-9]+' test-output.txt | tail -1)
          if [ -z "$tLine" ]; then
            echo "::error::Could not find a test summary line in the coverage test output."
            exit 1
          fi
          tSkipped=$(echo "$tLine" | sed -E 's/.*Skipped: +([0-9]+).*/\1/')
          tTotal=$(echo "$tLine"   | sed -E 's/.*Total: +([0-9]+).*/\1/')
          if [ "$tSkipped" -ne 0 ]; then
            echo "::error::$tSkipped test(s) skipped. The bar is 0 failed and 0 skipped, with no category filter."
            exit 1
          fi
          echo "tests=${tTotal}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport
          retention-days: 14

  # README badges (#112). Not a required check, and it never runs on a pull
  # request — the images reflect the last successful coverage run on main.
  #
  # Mechanism: this job renders three shields.io SVGs from the coverage job's
  # outputs and commits them to the `badges` orphan branch. The README points
  # at raw.githubusercontent.com URLs for those files, so a suite change does
  # not need a README commit.
  #
  # Why this, and not the alternatives the issue listed:
  # - A gist + shields endpoint needs a PAT with gist scope. The repo's only
  #   Actions secret is NVD_API_KEY. GITHUB_TOKEN cannot write gists.
  # - Publishing the SVGs via GitHub Pages would fight docs.yml, which owns
  #   the Pages artifact; a second deploy overwrites the documentation site.
  # - Codecov / Coveralls are the third-party hosts the issue ruled out.
  # - ReportGenerator's Badges report type is a different visual language
  #   from the shields.io CI / CodeQL / License row already on the README.
  #
  # Permission: contents: write on this job only, using GITHUB_TOKEN. No
  # extra secret. Do not protect the `badges` branch — a protection rule
  # would block the bot. Do not add `badges` to this workflow's push
  # trigger; that would loop. Do not force-push the branch.
  publish-badges:
    name: Publish README badges
    # success() is load-bearing: a job-level `if` replaces the implicit
    # "needs jobs succeeded" check, so without it this would still run
    # (and fail on empty outputs) when coverage is red.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render badge SVGs
        env:
          TESTS: ${{ needs.coverage.outputs.tests }}
          LINE: ${{ needs.coverage.outputs.line }}
          BRANCH: ${{ needs.coverage.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$TESTS" ] || [ -z "$LINE" ] || [ -z "$BRANCH" ]; then
            echo "::error::Coverage job did not produce badge values."
            exit 1
          fi
          mkdir -p badges
          curl -fsSL -A "dynamitey-community-ci" \
            "https://img.shields.io/badge/tests-${TESTS}-informational" \
            -o badges/tests.svg
          curl -fsSL -A "dynamitey-community-ci" \
            "https://img.shields.io/badge/line_coverage-${LINE}%25-brightgreen" \
            -o badges/line-coverage.svg
          curl -fsSL -A "dynamitey-community-ci" \
            "https://img.shields.io/badge/branch_coverage-${BRANCH}%25-brightgreen" \
            -o badges/branch-coverage.svg
          cat > badges/coverage.md <<EOF
          # Coverage

          Last successful \`Code coverage\` job on \`main\`. The shipped
          \`Dynamitey.Community\` assembly only (\`coverlet.runsettings\`).

          | Metric | Value |
          | --- | ---: |
          | Tests | ${TESTS} |
          | Line | ${LINE}% |
          | Branch | ${BRANCH}% |
          EOF

      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$repo" badges >/dev/null; then
            git clone --depth 1 --branch badges "$repo" badges-repo
          else
            git clone --depth 1 "$repo" badges-repo
            git -C badges-repo checkout --orphan badges
            git -C badges-repo rm -rf --quiet . || true
          fi

          cp badges/tests.svg badges/line-coverage.svg badges/branch-coverage.svg badges/coverage.md badges-repo/
          cat > badges-repo/README.md <<'EOF'
          Generated test-count and coverage badge SVGs, plus the coverage
          snapshot the README badges link to. Written by the `Publish README
          badges` job in `.github/workflows/ci.yml` on `main`. Do not edit by
          hand. See issue #112.
          EOF

          git -C badges-repo add tests.svg line-coverage.svg branch-coverage.svg coverage.md README.md
          if git -C badges-repo diff --cached --quiet; then
            echo "Badges unchanged."
            exit 0
          fi
          git -C badges-repo commit -m "Update test and coverage badges"
          git -C badges-repo push origin badges

  benchmarks-smoke:
    name: Benchmarks compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A dry job runs every benchmark exactly once. It measures nothing useful
      # and takes a couple of seconds, but it catches a benchmark that compiles
      # and then throws — which a build-only check would miss.
      - name: Dry-run every benchmark
        run: >
          dotnet run --configuration Release --project Benchmarks --
          --filter '*' --job dry --inProcess

  aot-smoke:
    name: AOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # AotSmokeTest is deliberately not in Dynamitey.sln: PublishAot pulls in the
      # ILCompiler package, and nothing else in the repository should pay that on an
      # ordinary build. This job is therefore the only thing that compiles it, which
      # is also what stops it rotting.
      # shell: bash is load-bearing, not decoration. The default run shell is
      # `bash -e`, which does not set pipefail, so the exit status of a pipeline is
      # tee's — always 0. A failed publish would sail past this step and surface
      # later as a confusing missing-binary error. `shell: bash` runs with
      # `-eo pipefail`, so the publish failure fails this step, where it belongs.
      - name: Publish NativeAOT
        shell: bash
        run: dotnet publish AotSmokeTest -c Release -r linux-x64 2>&1 | tee aot-publish.log

      # The value of the annotations added in #4 is that a consumer's warnings NAME
      # the Dynamitey API they called. Before those annotations the same publish
      # produced hundreds of anonymous warnings inside Dynamitey internals, naming
      # nothing actionable. If that regresses, the annotations have stopped working
      # even though everything still compiles.
      - name: Warnings must name Dynamitey APIs
        run: |
          named=$(grep -c 'Dynamitey\.Dynamic\.' aot-publish.log || true)
          echo "IL warnings naming a Dynamitey API: $named"
          if [ "$named" -lt 1 ]; then
            echo "::error::NativeAOT publish produced no IL warning naming a Dynamitey API. The trim/AOT annotations are missing or no longer reach consumers. See issue #4."
            exit 1
          fi

      # This library can never work under AOT. The binary asserts HOW it fails,
      # because the README and the annotation messages both describe specific
      # failures, and documentation that quietly stops being true is worse than none.
      - name: Documented failure modes still hold
        run: ./AotSmokeTest/bin/Release/net10.0/linux-x64/native/Dynamitey.AotSmokeTest
