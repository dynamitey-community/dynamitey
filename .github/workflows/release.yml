# Release machinery for Dynamitey.Community.
#
# A version tag publishes. workflow_dispatch builds, tests and packs, and does
# not push. The package id is Dynamitey.Community — never the original
# Dynamitey package. The verify step below rejects any other id before a push
# can run.
#
# Publishing uses NuGet Trusted Publishing (OIDC). There is no API key in the
# repository secrets. The nuget.org profile name is the repository variable
# NUGET_USER. The Trusted Publishing policy on nuget.org must name this
# workflow file (release.yml), this repository (dynamitey-community/dynamitey),
# and a package scope of Dynamitey.Community only. A scope of Dynamitey or
# Dynamitey* would be wrong: the first is the original package, and the second
# matches it.
name: Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was started (recorded in the run summary)'
        required: false
        default: 'Dry run of the release pipeline'
  push:
    tags:
      # GitVersion's tag-prefix accepts an optional v. Non-version tags such as
      # upstream-baseline do not match, so pushing one cannot publish.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# contents: read is enough to check the tree out. id-token: write lives only
# on the publish job, which runs solely for a tag push. A dry run and the
# build/test/pack steps cannot mint a NuGet token.
permissions:
  contents: read

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and tags. The default
          # shallow clone has neither, and it fails rather than guessing. This
          # matters more here than in ci.yml: the version this computes is the
          # version that would ship.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Same severity rules as ci.yml. Warnings stay warnings. An error still
      # fails the build.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Tests.csproj -c Release --no-build | tee test-output.txt

          tLine=$(grep -oE 'Failed: +[0-9]+, Passed: +[0-9]+, Skipped: +[0-9]+, Total: +[0-9]+' test-output.txt | tail -1)
          if [ -z "$tLine" ]; then
            echo "::error::Could not find a test summary line in the test output."
            exit 1
          fi

          tSkipped=$(echo "$tLine" | sed -E 's/.*Skipped: +([0-9]+).*/\1/')
          if [ "$tSkipped" -ne 0 ]; then
            echo "::error::$tSkipped test(s) skipped. The bar is 0 failed and 0 skipped, with no category filter."
            exit 1
          fi

      # Packs both target frameworks, plus a .snupkg of symbols. Source Link is
      # supplied by the .NET SDK (bundled since .NET 8) and configured by the
      # PublishRepositoryUrl / EmbedUntrackedSources properties in
      # Dynamitey.csproj; ContinuousIntegrationBuild switches itself on here via
      # the GITHUB_ACTIONS variable, which is what normalizes source paths so
      # Source Link can resolve them.
      - name: Pack
        run: dotnet pack Dynamitey/Dynamitey.csproj -c Release --no-build -o artifacts

      # Fails the run if the pack produced the legacy symbol format instead of a
      # .snupkg. nuget.org rejects .symbols.nupkg on push, and without this check
      # that rejection would surface at the first real publish - the worst moment
      # to find out. Cheap to assert here, so assert it every run.
      - name: Verify the package shape
        run: |
          set -euo pipefail
          ls -la artifacts
          if ls artifacts/*.symbols.nupkg >/dev/null 2>&1; then
            echo "::error::Packed the legacy .symbols.nupkg format; nuget.org rejects it. Check SymbolPackageFormat in Dynamitey.csproj."
            exit 1
          fi
          if ls artifacts/*.source.nupkg >/dev/null 2>&1; then
            echo "::error::Packed a legacy .source.nupkg. IncludeSource should remain unset/false (use Source Link instead)."
            exit 1
          fi
          if ! ls artifacts/*.snupkg >/dev/null 2>&1; then
            echo "::error::No .snupkg was produced, so the release would ship without usable symbols."
            exit 1
          fi

          # The id has to be Dynamitey.Community. The original Dynamitey package
          # on nuget.org belongs to the upstream maintainers; pushing a package
          # whose id is Dynamitey would be a write onto their package. Match the
          # filename and the nuspec id, and reject anything else that landed in
          # artifacts, including a name that merely starts with Dynamitey.
          shopt -s nullglob
          community=(artifacts/Dynamitey.Community.*.nupkg)
          if [ "${#community[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Dynamitey.Community nupkg, found ${#community[@]}."
            exit 1
          fi
          for pkg in artifacts/*.nupkg; do
            base=$(basename "$pkg")
            case "$base" in
              Dynamitey.Community.*) ;;
              *)
                echo "::error::Refusing to keep $base. The only package this repository publishes is Dynamitey.Community."
                exit 1
                ;;
            esac
          done
          rm -rf artifacts/nupkg-id
          mkdir artifacts/nupkg-id
          unzip -o -q "${community[0]}" -d artifacts/nupkg-id
          id=$(grep -oE '<id>[^<]+</id>' artifacts/nupkg-id/Dynamitey.Community.nuspec | head -1)
          if [ "$id" != "<id>Dynamitey.Community</id>" ]; then
            echo "::error::nuspec package id is '$id', not Dynamitey.Community. Refusing to publish."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Summarize
        env:
          REASON: ${{ inputs.reason }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "### Packages built, nothing published yet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Tag $REF_NAME passed packaging. The publish job pushes Dynamitey.Community only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Reason given for this run: $REASON" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "workflow_dispatch does not publish, including when it is started from a tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Separate job so the build, test, and pack steps cannot mint an OIDC token.
  # workflow_dispatch is excluded even when its ref is a tag: event_name is
  # the gate, not the ref alone. The path passed to nuget push is the one
  # file the shell expanded, not a quoted glob.
  publish:
    name: Push Dynamitey.Community
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts

      - name: Require the NuGet username
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository variable NUGET_USER is empty. Set it to the nuget.org profile name that owns the Trusted Publishing policy for Dynamitey.Community. It is a username, not an API key."
            exit 1
          fi

      - name: Confirm the package id
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          community=(artifacts/Dynamitey.Community.*.nupkg)
          if [ "${#community[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Dynamitey.Community nupkg, found ${#community[@]}."
            exit 1
          fi
          for pkg in artifacts/*.nupkg; do
            base=$(basename "$pkg")
            case "$base" in
              Dynamitey.Community.*) ;;
              *)
                echo "::error::Refusing to publish $base. The only package id is Dynamitey.Community."
                exit 1
                ;;
            esac
          done
          rm -rf artifacts/nupkg-id
          mkdir artifacts/nupkg-id
          unzip -o -q "${community[0]}" -d artifacts/nupkg-id
          id=$(grep -oE '<id>[^<]+</id>' artifacts/nupkg-id/Dynamitey.Community.nuspec | head -1)
          if [ "$id" != "<id>Dynamitey.Community</id>" ]; then
            echo "::error::nuspec package id is '$id', not Dynamitey.Community. Refusing to publish."
            exit 1
          fi
          echo "nupkg=${community[0]}" >> "$GITHUB_OUTPUT"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push Dynamitey.Community to NuGet.org
        run: dotnet nuget push "${{ steps.package.outputs.nupkg }}" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Summarize
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "### Published Dynamitey.Community $REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The original Dynamitey package was not touched." >> "$GITHUB_STEP_SUMMARY"
