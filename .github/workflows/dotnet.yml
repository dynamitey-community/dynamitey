name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      # Performance tests assert on wall-clock timings and are machine-dependent.
      # They are excluded here deliberately, not because they are broken. See #9.
      - name: Test
        run: >
          dotnet test Tests/Tests.csproj
          --configuration Release
          --no-build
          --filter TestCategory!=Performance
