# Blocks merge until Copilot's latest review of HEAD recommends it.
#
# Copilot still posts a Comment review, not Approve (that preview toggle is
# off, and raising required approvals to 1 would lock out the solo maintainer).
# Conversation resolution is already required, but Copilot often finishes at
# or after merge — so unresolved 🟡 comments land on main. This check waits
# for the review of the current head SHA and fails on "Changes recommended",
# a failed review, or a timeout. See #119.
name: Copilot review

on:
  pull_request:
    # Defaults plus ready_for_review: a draft that timed out before Copilot
    # finished would otherwise stay red after the PR is marked ready.
    # edited: retargeting the base (or other PR metadata) must start a run
    # so the required check is not pending forever with no synchronize.
    # Do not also subscribe to pull_request_review. Copilot's review event
    # starts a sibling run GitHub marks action_required, which cancels this
    # waiter via concurrency and leaves the PR UNSTABLE. A later Copilot
    # edit from Approval recommended to Changes recommended therefore does
    # not re-run this job; a new push or a manual re-run does.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-review:
    name: Copilot review
    if: github.event.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Once this file exists on main, ignore a PR that rewrites the waiter.
      # The workflow YAML itself still comes from the pull_request event; a
      # ruleset required-workflow from main is the remaining lock and can be
      # added after this lands on the default branch.
      - name: Prefer the gate script from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "${BASE_SHA}:.github/scripts/wait_for_copilot_review.py"; then
            git checkout "$BASE_SHA" -- .github/scripts/wait_for_copilot_review.py
          fi

      - name: Wait for Copilot to recommend merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TIMEOUT_SECONDS: "900"
          POLL_SECONDS: "20"
        run: python3 .github/scripts/wait_for_copilot_review.py
